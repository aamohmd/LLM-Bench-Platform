services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - benchmark_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Required — must be set in .env
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      EXPERIMENT_TAG: ${EXPERIMENT_TAG:-}
      GIT_REVISION: ${GIT_REVISION:-}
      RESULTS_DIR: /app/data/results
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - benchmark_results:/app/data/results
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ui:
    build: ./dashboard
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BENCHMARK_API_URL: http://backend:8000
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  benchmark_postgres:
  benchmark_results:
